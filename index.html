<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Трансформация</title>

<!-- PWA / iOS Home Screen -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Рекомп">
<meta name="theme-color" content="#fbfbfd">
<link rel="icon" type="image/png" href="apple-touch-icon.png">

<style>
:root {
  --bg: #fbfbfd;
  --surface: #ffffff;
  --surface-2: #f5f5f7;
  --text: #1d1d1f;
  --text-2: #6e6e73;
  --text-3: #86868b;
  --separator: rgba(0, 0, 0, 0.06);
  --separator-strong: rgba(0, 0, 0, 0.12);
  --accent: #1d1d1f;
  --green: #34c759;
  --red: #ff3b30;
  --blue: #007aff;
  --orange: #ff9500;
  --yellow: #ffcc00;
  --purple: #af52de;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.06);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01", "cv11";
}

body {
  max-width: 680px;
  margin: 0 auto;
  padding: 16px 16px 80px;
  font-size: 15px;
  line-height: 1.45;
  letter-spacing: -0.01em;
}

button { font-family: inherit; cursor: pointer; }

.header { padding: 12px 4px 20px; }
.header-eyebrow {
  font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
  color: var(--text-3); text-transform: uppercase; margin-bottom: 6px;
}
.header-title {
  font-size: 34px; font-weight: 700; letter-spacing: -0.02em;
  line-height: 1.05; margin-bottom: 4px;
}
.header-sub { font-size: 14px; color: var(--text-2); letter-spacing: -0.005em; }

.tabbar {
  display: flex; gap: 2px; padding: 2px;
  background: var(--surface-2); border-radius: 10px; margin-bottom: 20px;
}
.tab {
  flex: 1; padding: 8px 12px; border: none; background: transparent;
  border-radius: 8px; font-size: 13px; font-weight: 500;
  color: var(--text-2); transition: all 0.2s; letter-spacing: -0.005em;
}
.tab.active {
  background: var(--surface); color: var(--text);
  font-weight: 600; box-shadow: var(--shadow-sm);
}

.day-strip {
  display: flex; gap: 6px; overflow-x: auto;
  margin-bottom: 16px; padding: 2px 0 6px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.day-strip::-webkit-scrollbar { display: none; }
.day-pill {
  background: var(--surface); border: 1px solid var(--separator);
  border-radius: 12px; padding: 8px 12px; font-size: 12px;
  font-weight: 500; color: var(--text-2); white-space: nowrap;
  flex-shrink: 0; display: flex; align-items: center; gap: 6px;
  letter-spacing: -0.005em; transition: all 0.15s;
}
.day-pill.active {
  background: var(--text); border-color: var(--text); color: var(--surface);
}
.day-pill .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); }
.day-pill.active .dot { background: rgba(255,255,255,0.6); }

.stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; margin-bottom: 16px;
}
.stat {
  background: var(--surface); border-radius: 14px;
  padding: 14px 14px 12px; box-shadow: var(--shadow-sm);
}
.stat-label {
  font-size: 11px; font-weight: 500; color: var(--text-3);
  text-transform: uppercase; margin-bottom: 6px;
}
.stat-value {
  font-size: 26px; font-weight: 700; letter-spacing: -0.03em;
  line-height: 1; font-feature-settings: "tnum";
}
.stat-unit {
  font-size: 13px; font-weight: 500; color: var(--text-3);
  margin-left: 2px; letter-spacing: -0.01em;
}
.stat-delta {
  font-size: 12px; color: var(--text-2);
  margin-top: 4px; font-feature-settings: "tnum";
}
.stat-delta.pos { color: var(--green); }
.stat-delta.neg { color: var(--red); }

.card {
  background: var(--surface); border-radius: 16px;
  padding: 18px; margin-bottom: 12px; box-shadow: var(--shadow-sm);
}
.card-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 14px; gap: 12px;
}
.card-title { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
.card-meta {
  font-size: 12px; color: var(--text-3); font-feature-settings: "tnum";
  flex-shrink: 0; text-align: right;
}
.card-sub { font-size: 13px; color: var(--text-2); margin-top: 2px; }

.block { margin-bottom: 18px; }
.block:last-child { margin-bottom: 0; }
.block-title {
  font-size: 11px; font-weight: 600; color: var(--text-3);
  text-transform: uppercase; letter-spacing: 0.04em;
  margin-bottom: 8px; padding: 0 2px;
}

.exercise {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 4px; border-bottom: 1px solid var(--separator);
  cursor: pointer; user-select: none; transition: opacity 0.15s;
}
.exercise:last-child { border-bottom: none; }
.exercise:active { opacity: 0.5; }
.exercise.done .exercise-text { text-decoration: line-through; color: var(--text-3); }
.checkbox {
  width: 22px; height: 22px; border: 1.5px solid var(--separator-strong);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.15s; background: var(--surface);
}
.exercise.done .checkbox { background: var(--green); border-color: var(--green); }
.checkbox::after {
  content: ''; width: 10px; height: 5px;
  border-left: 2px solid var(--surface); border-bottom: 2px solid var(--surface);
  transform: rotate(-45deg) translate(1px, -2px); opacity: 0; transition: opacity 0.15s;
}
.exercise.done .checkbox::after { opacity: 1; }
.exercise-text { flex: 1; font-size: 15px; letter-spacing: -0.01em; }
.exercise-hint {
  font-size: 12px; color: var(--text-3);
  margin-top: 3px; line-height: 1.35;
  letter-spacing: -0.005em;
}
.exercise.done .exercise-hint { color: var(--text-3); opacity: 0.6; }

.tip {
  background: var(--surface-2); border-radius: 10px;
  padding: 12px 14px; font-size: 13px; line-height: 1.5;
  color: var(--text-2); margin-bottom: 16px; letter-spacing: -0.005em;
}
.tip-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
  color: var(--text); text-transform: uppercase;
  display: block; margin-bottom: 4px;
}

.field { margin-bottom: 10px; }
.field:last-child { margin-bottom: 0; }
.field-grid-2 {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-bottom: 10px;
}
.field-label {
  font-size: 12px; font-weight: 500; color: var(--text-2);
  margin-bottom: 6px; display: block;
}
.input {
  width: 100%; background: var(--surface-2); border: 1px solid transparent;
  border-radius: 10px; padding: 11px 12px; font-size: 15px;
  font-family: inherit; color: var(--text); letter-spacing: -0.01em;
  font-feature-settings: "tnum"; transition: all 0.15s;
}
.input:focus { outline: none; background: var(--surface); border-color: var(--blue); }
.input::placeholder { color: var(--text-3); }

.notes {
  width: 100%; background: var(--surface-2); border: 1px solid transparent;
  border-radius: 10px; padding: 11px 12px; font-size: 15px;
  font-family: inherit; color: var(--text); resize: vertical; min-height: 72px;
}
.notes:focus { outline: none; background: var(--surface); border-color: var(--blue); }

.cal {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
}
.cal-cell {
  aspect-ratio: 1; background: var(--surface-2); border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 500; color: var(--text-2);
  cursor: pointer; font-feature-settings: "tnum"; transition: all 0.15s;
}
.cal-cell.done { background: var(--green); color: white; }
.cal-cell.partial { background: rgba(52, 199, 89, 0.2); color: #0e8038; }
.cal-cell.today { outline: 2px solid var(--text); outline-offset: -2px; }
.cal-cell.future { opacity: 0.45; }

.legend {
  display: flex; gap: 14px; margin-top: 14px;
  font-size: 11px; color: var(--text-3); flex-wrap: wrap;
}
.legend-dot {
  display: inline-block; width: 9px; height: 9px;
  border-radius: 3px; margin-right: 5px; vertical-align: -1px;
}

.prog-row {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 8px; font-size: 12px; color: var(--text-2);
}
.prog-row strong {
  color: var(--text); font-weight: 600; font-feature-settings: "tnum";
}
.prog-bar {
  height: 6px; background: var(--surface-2);
  border-radius: 3px; overflow: hidden;
}
.prog-fill {
  height: 100%; background: var(--text);
  border-radius: 3px; transition: width 0.4s ease;
}
.prog-fill.green { background: var(--green); }
.prog-fill.orange { background: var(--orange); }
.prog-fill.red { background: var(--red); }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; background: var(--text); color: var(--surface);
  border: none; border-radius: 10px; padding: 11px 16px;
  font-size: 14px; font-weight: 600; transition: opacity 0.15s;
}
.btn:active { opacity: 0.7; }
.btn-secondary { background: var(--surface-2); color: var(--text); }
.btn-danger { background: transparent; color: var(--red); border: 1px solid var(--separator); }
.btn-full { width: 100%; }
.btn-sm { padding: 8px 12px; font-size: 13px; }

/* MACRO */
.macro-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 10px; margin-bottom: 4px;
}

/* ACTIVITY */
.act-row {
  padding: 12px 0;
  border-bottom: 1px solid var(--separator);
}
.act-row:last-child { border-bottom: none; }
.act-row-head {
  display: flex; justify-content: space-between;
  align-items: baseline; margin-bottom: 6px;
}
.act-label {
  font-size: 13px; color: var(--text-2);
  font-weight: 500; letter-spacing: -0.005em;
}
.act-value {
  font-feature-settings: "tnum"; font-weight: 600;
  font-size: 14px; color: var(--text);
}
.act-value .target {
  color: var(--text-3); font-weight: 500;
  font-size: 12px;
}
.act-bar {
  height: 5px; background: var(--surface-2);
  border-radius: 3px; overflow: hidden; margin-bottom: 8px;
}
.act-bar-fill {
  height: 100%; border-radius: 3px;
  transition: width 0.4s ease;
}
.act-controls {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-top: 6px;
}
.act-btn {
  background: var(--surface-2); border: none;
  border-radius: 8px; padding: 6px 10px;
  font-size: 12px; font-weight: 500;
  color: var(--text); font-feature-settings: "tnum";
  transition: opacity 0.15s;
}
.act-btn:active { opacity: 0.6; }
.act-btn.danger { color: var(--red); }
.act-input-inline {
  background: var(--surface-2); border: 1px solid transparent;
  border-radius: 8px; padding: 6px 10px;
  font-size: 13px; font-family: inherit;
  font-feature-settings: "tnum"; width: 90px;
  color: var(--text);
}
.act-input-inline:focus {
  outline: none; background: var(--surface);
  border-color: var(--blue);
}
.act-burn {
  display: flex; justify-content: space-between;
  align-items: center; padding-top: 8px;
}
.act-burn-label {
  font-size: 13px; color: var(--text-2);
}
.act-burn-value {
  font-size: 18px; font-weight: 700;
  letter-spacing: -0.02em; font-feature-settings: "tnum";
  color: var(--orange);
}
.macro { text-align: center; }
.macro-label {
  font-size: 10px; font-weight: 600; color: var(--text-3);
  text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 4px;
}
.macro-value {
  font-size: 18px; font-weight: 700; letter-spacing: -0.02em;
  font-feature-settings: "tnum"; color: var(--text);
}
.macro-target {
  font-size: 11px; color: var(--text-3); font-feature-settings: "tnum";
}
.macro-bar {
  height: 3px; background: var(--surface-2);
  border-radius: 2px; overflow: hidden; margin-top: 6px;
}
.macro-bar-fill {
  height: 100%; border-radius: 2px; transition: width 0.4s;
}

/* MEAL */
.meal {
  padding: 14px 0; border-bottom: 1px solid var(--separator);
}
.meal:last-child { border-bottom: none; }
.meal-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 8px;
}
.meal-name {
  font-size: 15px; font-weight: 600; color: var(--text);
  letter-spacing: -0.01em;
}
.meal-time-kcal {
  font-size: 12px; color: var(--text-2);
  font-feature-settings: "tnum";
}
.meal-items {
  padding: 4px 0 8px;
}
.meal-item {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 4px 0; font-size: 13px; color: var(--text-2);
  letter-spacing: -0.005em;
}
.meal-item-name { flex: 1; }
.meal-item-qty {
  font-feature-settings: "tnum";
  color: var(--text);
  font-weight: 500;
  margin-left: 8px;
}
.meal-item-kcal {
  font-feature-settings: "tnum";
  margin-left: 10px;
  min-width: 50px;
  text-align: right;
  color: var(--text-3);
}
.meal-macros {
  display: flex; gap: 14px; font-size: 12px; color: var(--text-2);
  font-feature-settings: "tnum"; padding-top: 4px;
  border-top: 1px solid var(--separator);
}
.meal-macros span strong { color: var(--text); font-weight: 600; }
.meal-actions {
  display: flex; gap: 6px; margin-left: auto;
}
.meal-action-btn {
  background: transparent; border: none; color: var(--text-3);
  font-size: 12px; padding: 4px 8px;
}
.meal-action-btn:active { color: var(--text); }
.meal-action-btn.danger:active { color: var(--red); }

/* TEMPLATES */
.tpl-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; margin-bottom: 12px;
}
.tpl-btn {
  background: var(--surface-2); border: 1px solid transparent;
  border-radius: 12px; padding: 12px 10px; text-align: left;
  transition: all 0.15s;
}
.tpl-btn:active { background: var(--surface); border-color: var(--separator); }
.tpl-emoji { font-size: 20px; margin-bottom: 4px; display: block; }
.tpl-name { font-size: 13px; font-weight: 600; color: var(--text); }
.tpl-kcal {
  font-size: 11px; color: var(--text-3);
  margin-top: 2px; font-feature-settings: "tnum";
}

/* HABIT */
.habit-big { text-align: center; padding: 8px 0 16px; }
.habit-big-num {
  font-size: 64px; font-weight: 700; letter-spacing: -0.04em;
  line-height: 1; font-feature-settings: "tnum"; color: var(--text);
}
.habit-big-label {
  font-size: 13px; color: var(--text-2); margin-top: 6px;
}
.habit-stats {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; margin-bottom: 16px;
}
.habit-stat {
  background: var(--surface-2); border-radius: 10px;
  padding: 12px; text-align: center;
}
.habit-stat-num {
  font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
  font-feature-settings: "tnum";
}
.habit-stat-label { font-size: 11px; color: var(--text-2); margin-top: 2px; }
.habit-list { max-height: 280px; overflow-y: auto; }

/* MILESTONES */
.milestone-next {
  background: linear-gradient(135deg, rgba(52, 199, 89, 0.08), rgba(0, 122, 255, 0.06));
  border-left: 3px solid var(--green);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 16px;
}
.milestone-next-label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--green); margin-bottom: 6px;
}
.milestone-next-text {
  font-size: 14px; line-height: 1.45;
  color: var(--text); letter-spacing: -0.005em;
}
.milestone-list {
  position: relative;
}
.milestone {
  display: flex; gap: 12px;
  padding: 10px 0;
  position: relative;
}
.milestone:not(:last-child)::before {
  content: '';
  position: absolute;
  left: 5px; top: 24px; bottom: -2px;
  width: 1px; background: var(--separator);
}
.milestone.done:not(:last-child)::before {
  background: var(--green);
  opacity: 0.4;
}
.milestone-dot {
  width: 11px; height: 11px;
  border-radius: 50%;
  background: var(--surface-2);
  border: 1.5px solid var(--separator-strong);
  flex-shrink: 0; margin-top: 4px;
  position: relative; z-index: 1;
}
.milestone.done .milestone-dot {
  background: var(--green);
  border-color: var(--green);
}
.milestone-body { flex: 1; opacity: 0.5; }
.milestone.done .milestone-body { opacity: 1; }
.milestone-time {
  font-size: 13px; font-weight: 600;
  color: var(--text); letter-spacing: -0.005em;
}
.milestone-desc {
  font-size: 12px; color: var(--text-2);
  margin-top: 2px; line-height: 1.4;
}
.milestone.done .milestone-desc { color: var(--text-2); }
.habit-entry {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 4px; border-bottom: 1px solid var(--separator); font-size: 14px;
}
.habit-entry:last-child { border-bottom: none; }
.habit-entry-date {
  color: var(--text-2); font-size: 12px;
  font-feature-settings: "tnum"; min-width: 60px;
}
.habit-entry-detail { flex: 1; margin: 0 10px; }
.habit-entry-amount { font-weight: 600; font-feature-settings: "tnum"; }

.empty {
  text-align: center; padding: 24px 16px;
  color: var(--text-3); font-size: 13px;
}

.bottom-zone {
  display: flex; gap: 8px; justify-content: center;
  margin-top: 24px; flex-wrap: wrap;
}

.loading {
  text-align: center; padding: 80px 20px;
  color: var(--text-3); font-size: 13px;
}

.seg {
  display: flex; gap: 2px; padding: 2px;
  background: var(--surface-2); border-radius: 9px; margin-bottom: 16px;
}
.seg-btn {
  flex: 1; padding: 7px 10px; border: none; background: transparent;
  border-radius: 7px; font-size: 13px; font-weight: 500;
  color: var(--text-2); transition: all 0.2s;
}
.seg-btn.active {
  background: var(--surface); color: var(--text);
  font-weight: 600; box-shadow: var(--shadow-sm);
}

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.4);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 1000;
  animation: fadeIn 0.2s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg); width: 100%; max-width: 680px;
  border-radius: 20px 20px 0 0;
  max-height: 90vh; overflow-y: auto;
  animation: slideUp 0.25s;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.modal-head {
  position: sticky; top: 0; background: var(--bg);
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--separator);
  display: flex; justify-content: space-between; align-items: center;
  z-index: 10;
}
.modal-title { font-size: 18px; font-weight: 600; }
.modal-close {
  background: var(--surface-2); border: none;
  width: 30px; height: 30px; border-radius: 50%;
  font-size: 16px; color: var(--text-2);
}
.modal-body { padding: 16px; }

.food-search-tabs {
  display: flex; gap: 2px; padding: 2px;
  background: var(--surface-2); border-radius: 10px; margin-bottom: 16px;
}

/* FOOD LIST */
.food-cat {
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--text-3); margin: 16px 0 6px; padding: 0 4px;
}
.food-cat:first-child { margin-top: 0; }

.search-row {
  display: flex; gap: 8px; margin-bottom: 12px;
  position: sticky; top: 56px; background: var(--bg);
  padding: 6px 0; z-index: 5;
}
.search-input { flex: 1; }
.food-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 4px; border-bottom: 1px solid var(--separator);
  cursor: pointer;
}
.food-item:active { background: var(--surface-2); }
.food-item-info { flex: 1; }
.food-item-name { font-size: 14px; font-weight: 500; color: var(--text); }
.food-item-meta {
  font-size: 11px; color: var(--text-3);
  margin-top: 2px; font-feature-settings: "tnum";
}
.food-item-add {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--text); color: var(--surface);
  border: none; font-size: 18px; font-weight: 300;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* PARSED PREVIEW */
.parsed-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 12px; background: var(--surface);
  border-radius: 10px; margin-bottom: 6px;
  border: 1px solid var(--separator);
}
.parsed-item.unknown {

function getMilestoneStatus(daysWithout, milestones) {
  const hours = daysWithout * 24;
  let current = null;
  let next = null;
  let achieved = [];
  for (const m of milestones) {
    if (hours >= m.h) {
      achieved.push(m);
      current = m;
    } else if (!next) {
      next = m;
    }
  }
  return { achieved, current, next };
}

function renderMilestones(daysWithout, milestones) {
  const { achieved, next } = getMilestoneStatus(daysWithout, milestones);
  return `
    <div class="card">
      <div class="card-head">
        <div class="card-title">Что происходит с организмом</div>
        <div class="card-meta">медицинские данные</div>
      </div>
      ${next ? `
        <div class="milestone-next">
          <div class="milestone-next-label">Следующая веха · ${escapeHtml(next.t)}</div>
          <div class="milestone-next-text">${escapeHtml(next.d)}</div>
        </div>
      ` : ''}
      <div class="milestone-list">
        ${milestones.map(m => {
          const done = achieved.includes(m);
          return `
            <div class="milestone ${done ? 'done' : ''}">
              <div class="milestone-dot"></div>
              <div class="milestone-body">
                <div class="milestone-time">${escapeHtml(m.t)}</div>
                <div class="milestone-desc">${escapeHtml(m.d)}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

// ===== UTILS =====
function todayStr() { return dateStr(new Date()); }
function dateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function parseDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function daysBetween(from, to) {
  return Math.round((parseDate(to) - parseDate(from)) / 86400000);
}
function formatShortDate(ds) {
  const d = parseDate(ds);
  return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`;
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function round(n, d=0) {
  const f = Math.pow(10, d);
  return Math.round(n * f) / f;
}

// ===== FOOD =====
function findFood(text) {
  if (!text) return null;
  text = text.toLowerCase().trim();
  const all = getAllFoods();
  // Сначала точное совпадение
  for (const f of all) {
    if (f.name.toLowerCase() === text) return f;
    for (const m of (f.match || [])) {
      if (m === text) return f;
    }
  }
  // Потом подстрока
  for (const f of all) {
    for (const m of (f.match || [])) {
      if (text.includes(m) || m.includes(text)) return f;
    }
  }
  return null;
}

function calcItem(food, qty) {
  // Для unit='г' или 'мл': qty это граммы/мл, кбжу за `per` единиц
  // Для unit='шт', 'порция', 'ст.л.', 'ч.л.': qty это штуки/порции, кбжу за 1
  let scale;
  if (food.unit === 'г' || food.unit === 'мл') {
    scale = qty / food.per;
  } else {
    scale = qty; // qty штук/порций × кбжу_за_единицу
  }
  return {
    foodName: food.name,
    qty: qty,
    unit: food.unit,
    kcal: round(food.kcal * scale, 1),
    p: round(food.p * scale, 1),
    f: round(food.f * scale, 1),
    c: round(food.c * scale, 1)
  };
}

function parseFreeText(text) {
  const segments = text.split(/[,\n;]+/).map(s => s.trim()).filter(Boolean);
  const results = [];
  for (const seg of segments) {
    // Ищем число с дробью
    const numMatch = seg.match(/(\d+(?:[.,]\d+)?)/);
    if (!numMatch) {
      const food = findFood(seg);
      if (food) {
        // qty по умолчанию — 1 для штучных, 100 для граммовых
        const qty = (food.unit === 'г' || food.unit === 'мл') ? 100 : 1;
        results.push({ status: 'ok', item: calcItem(food, qty), rawText: seg });
      } else {
        results.push({ status: 'unknown', rawText: seg });
      }
      continue;
    }
    const qty = parseFloat(numMatch[1].replace(',', '.'));
    const remaining = seg.replace(numMatch[0], '')
      .replace(/(грамм(ов|а)?|гр\.?|г\.?|мл|шт(ук[аиов]?)?|порц[ийя]+|ст\.?\s*л\.?|ч\.?\s*л\.?|кусоч[ек]+|ломтик[аов]?|stuk|штуки)/gi, '')
      .trim();
    const food = findFood(remaining);
    if (food) {
      results.push({ status: 'ok', item: calcItem(food, qty), rawText: seg });
    } else {
      results.push({ status: 'unknown', rawText: seg, qty });
    }
  }
  return results;
}

// ===== STORAGE =====
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      state.config = { ...state.config, ...(saved.config || {}) };
      state.logs = saved.logs || {};
      state.habits = { smoking: [], alcohol: [], ...(saved.habits || {}) };
      state.customFoods = saved.customFoods || [];
    }
  } catch (e) {}
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      config: state.config,
      logs: state.logs,
      habits: state.habits,
      customFoods: state.customFoods
    }));
  } catch (e) {}
}

function getAllFoods() {
  // Кастомные продукты идут в начало для удобства
  return [...(state.customFoods || []).map(f => ({...f, custom: true})), ...FOODS];
}

// ===== HELPERS =====
function getLog(date) {
  if (!state.logs[date]) {
    state.logs[date] = { exercises: {}, weight: null, pullups: null, notes: '', meals: [], water: 0, steps: null, swim: null };
  }
  if (!state.logs[date].meals) state.logs[date].meals = [];
  if (state.logs[date].water == null) state.logs[date].water = 0;
  if (state.logs[date].steps === undefined) state.logs[date].steps = null;
  if (state.logs[date].swim === undefined) state.logs[date].swim = null;
  return state.logs[date];
}

function getLastWeight() {
  const dates = Object.keys(state.logs).sort().reverse();
  for (const d of dates) {
    if (state.logs[d].weight != null) return state.logs[d].weight;
  }
  return state.config.startWeight;
}

function getMaxPullups() {
  let max = 0;
  for (const d in state.logs) {
    const v = state.logs[d].pullups;
    if (v != null && v > max) max = v;
  }
  return max;
}

function getDayCompletion(date) {
  const log = state.logs[date];
  if (!log) return { done: 0, total: 0, pct: 0 };
  const total = Object.keys(log.exercises).length;
  const done = Object.values(log.exercises).filter(v => v).length;
  return { done, total, pct: total === 0 ? 0 : done / total };
}

function getTotalExercisesForDay(date) {
  const d = parseDate(date).getDay();
  let total = 0;
  for (const block in WORKOUTS[d].blocks) total += WORKOUTS[d].blocks[block].length;
  return total;
}

function getMealTotal(meal) {
  return (meal.items || []).reduce((acc, item) => ({
    kcal: acc.kcal + (item.kcal || 0),
    p: acc.p + (item.p || 0),
    f: acc.f + (item.f || 0),
    c: acc.c + (item.c || 0)
  }), { kcal: 0, p: 0, f: 0, c: 0 });
}

function getDayMacros(date) {
  const log = state.logs[date];
  if (!log || !log.meals) return { kcal: 0, p: 0, f: 0, c: 0 };
  return log.meals.reduce((acc, meal) => {
    const t = getMealTotal(meal);
    return {
      kcal: acc.kcal + t.kcal,
      p: acc.p + t.p,
      f: acc.f + t.f,
      c: acc.c + t.c
    };
  }, { kcal: 0, p: 0, f: 0, c: 0 });
}

// Примерные калории за блок тренировки (если выполнен полностью)
const BLOCK_KCAL = {
  'Утро': 230,                       // бег 2-3км + подтягивания
  'Утро · Кардио': 350,              // длинный бег 4-5 км
  'День · 15 мин': 110,              // кор-цепочка
  'Вечер · 45 мин': 280,             // силовая с гантелями
  'Бассейн (когда возобновишь)': 0,
  'Альтернатива · 30 мин кор': 200,
  'Альтернатива · 35 мин': 240,
  'Растяжка · 10 мин': 30,
  'Растяжка · 20 мин': 50,
  'Опционально': 40,
  'Бассейн или Спина': 0
};

function getBurnedCalories(date) {
  const dow = parseDate(date).getDay();
  const workout = WORKOUTS[dow];
  if (!workout) return 0;
  const log = state.logs[date];
  if (!log || !log.exercises) return 0;
  let total = 0;
  let exerciseIdx = 0;
  for (const [blockName, exs] of Object.entries(workout.blocks)) {
    const blockTotal = exs.length;
    let blockDone = 0;
    for (const ex of exs) {
      const id = `ex_${exerciseIdx++}`;
      if (log.exercises[id]) blockDone++;
    }
    const blockKcal = BLOCK_KCAL[blockName] != null ? BLOCK_KCAL[blockName] : 100;
    total += blockKcal * (blockTotal === 0 ? 0 : blockDone / blockTotal);
  }
  return Math.round(total);
}

function renderDayStrip(selected) {
  const today = todayStr();
  const out = [];
  for (let i = -3; i <= 3; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    const ds = dateStr(d);
    const dayD = d.getDay();
    const isToday = ds === today;
    const isSel = ds === selected;
    const compl = getDayCompletion(ds);
    const hasProgress = compl.done > 0;
    out.push(`
      <button class="day-pill ${isSel ? 'active' : ''}" onclick="selectDate('${ds}')">
        ${DAY_NAMES_SHORT[dayD]} ${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}${isToday ? ' · сегодня' : ''}${hasProgress ? '<span class="dot"></span>' : ''}
      </button>
    `);
  }
  return `<div class="day-strip">${out.join('')}</div>`;
}

function renderWorkout(selected) {
  const today = todayStr();
  const dayNum = Math.max(1, daysBetween(state.config.startDate, today) + 1);
  const daysLeft = Math.max(0, state.config.targetDays - dayNum + 1);
  const currentWeight = getLastWeight();
  const weightDelta = currentWeight - state.config.startWeight;
  const maxPullups = getMaxPullups();

  const dow = parseDate(selected).getDay();
  const workout = WORKOUTS[dow];
  const log = getLog(selected);
  const compl = getDayCompletion(selected);
  const total = getTotalExercisesForDay(selected);

  const calCells = [];
  const startD = parseDate(state.config.startDate);
  const todayD = parseDate(today);
  for (let i = 0; i < state.config.targetDays; i++) {
    const d = new Date(startD);
    d.setDate(d.getDate() + i);
    const ds = dateStr(d);
    const c = getDayCompletion(ds);
    const isToday = ds === today;
    const isFuture = d > todayD;
    let cls = 'cal-cell';
    if (isFuture) cls += ' future';
    if (c.pct >= 0.7) cls += ' done';
    else if (c.pct > 0) cls += ' partial';
    if (isToday) cls += ' today';
    calCells.push(`<div class="${cls}" onclick="selectDate('${ds}')">${i + 1}</div>`);
  }

  let daysCompleted = 0;
  for (let i = 0; i < dayNum; i++) {
    const d = new Date(startD);
    d.setDate(d.getDate() + i);
    if (getDayCompletion(dateStr(d)).pct >= 0.7) daysCompleted++;
  }
  const progressPct = Math.round((daysCompleted / state.config.targetDays) * 100);

  let exerciseIdx = 0;
  const blocksHtml = Object.entries(workout.blocks).map(([blockName, exs]) => `
    <div class="block">
      <div class="block-title">${blockName}</div>
      ${exs.map(ex => {
        const id = `ex_${exerciseIdx++}`;
        const done = !!log.exercises[id];
        const text = typeof ex === 'string' ? ex : ex.t;
        const hint = typeof ex === 'string' ? '' : (ex.h || '');
        return `
          <div class="exercise ${done ? 'done' : ''}" onclick="toggleExercise('${selected}', '${id}')">
            <div class="checkbox"></div>
            <div class="exercise-text">
              <div>${escapeHtml(text)}</div>
              ${hint ? `<div class="exercise-hint">${escapeHtml(hint)}</div>` : ''}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `).join('');

  return `
    <div class="stats">
      <div class="stat">
        <div class="stat-label">День</div>
        <div class="stat-value">${dayNum}<span class="stat-unit">/${state.config.targetDays}</span></div>
        <div class="stat-delta">${daysLeft > 0 ? daysLeft + ' до финиша' : 'финиш'}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Вес</div>
        <div class="stat-value"><span id="stat-weight-val">${currentWeight}</span><span class="stat-unit">кг</span></div>
        <div id="stat-weight-delta" class="stat-delta ${weightDelta < 0 ? 'pos' : weightDelta > 0 ? 'neg' : ''}">${weightDelta === 0 ? '—' : (weightDelta > 0 ? '+' : '') + weightDelta.toFixed(1) + ' кг'}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Турник</div>
        <div class="stat-value"><span id="stat-pullups-val">${maxPullups}</span><span class="stat-unit">макс</span></div>
        <div class="stat-delta">цель: ${state.config.targetPullups}</div>
      </div>
    </div>

    <div class="card">
      <div class="prog-row">
        <span>Прогресс протокола</span>
        <strong>${daysCompleted} / ${state.config.targetDays} · ${progressPct}%</strong>
      </div>
      <div class="prog-bar"><div class="prog-fill green" style="width:${progressPct}%"></div></div>
    </div>

    ${renderDayStrip(selected)}

    <div class="card">
      <div class="card-head">
        <div>
          <div class="card-title">${workout.name}</div>
          <div class="card-sub">${DAY_NAMES_FULL[dow]} · ${formatShortDate(selected)}</div>
        </div>
        <div class="card-meta">${compl.done}/${total}</div>
      </div>
      ${workout.tip ? `<div class="tip"><span class="tip-label">Фокус дня</span>${escapeHtml(workout.tip)}</div>` : ''}
      ${blocksHtml}
    </div>

    <div class="card">
      <div class="card-head">
        <div class="card-title">Замеры</div>
        <div class="card-meta">${formatShortDate(selected)}</div>
      </div>
      <div class="field-grid-2">
        <div class="field">
          <label class="field-label">Вес, кг</label>
          <input type="number" step="0.1" inputmode="decimal" class="input" placeholder="—"
            value="${log.weight ?? ''}"
            onchange="updateField('${selected}', 'weight', this.value, 'float')">
        </div>
        <div class="field">
          <label class="field-label">Подтягиваний (макс)</label>
          <input type="number" inputmode="numeric" class="input" placeholder="—"
            value="${log.pullups ?? ''}"
            onchange="updateField('${selected}', 'pullups', this.value, 'int')">
        </div>
      </div>
      <div class="field">
        <label class="field-label">Заметки</label>
        <textarea class="notes" placeholder="Самочувствие, энергия, что пошло, что нет..."
          onchange="updateField('${selected}', 'notes', this.value, 'str')">${escapeHtml(log.notes || '')}</textarea>
      </div>
    </div>

    ${renderActivityCard(selected)}

    <div class="card">
      <div class="card-head">
        <div class="card-title">Календарь</div>
        <div class="card-meta">30 дней</div>
      </div>
      <div class="cal">${calCells.join('')}</div>
      <div class="legend">
        <span><span class="legend-dot" style="background:var(--green)"></span>готово</span>
        <span><span class="legend-dot" style="background:rgba(52, 199, 89, 0.2)"></span>частично</span>
        <span><span class="legend-dot" style="background:transparent; outline: 2px solid var(--text); outline-offset:-2px"></span>сегодня</span>
      </div>
    </div>
  `;
}

  return `

        </div>
      </div>

      <div class="macro-grid">

        <div class="macro">

          <div class="macro-target">/ ${t.targetCarbs} г</div>

        </div>
      </div>

      ${(() => {
        const burned = getBurnedCalories(selected);
        const net = Math.round(macros.kcal) - burned;
        const deficit = t.targetKcal - net;
        const deficitColor = deficit > 0 ? 'var(--green)' : deficit < -200 ? 'var(--red)' : 'var(--text-2)';

        <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--separator); display:flex; justify-content:space-around; text-align:center; gap:8px;">

            <div class="macro-label">Съедено</div>
            <div class="macro-value" style="font-size:16px">${Math.round(macros.kcal)}</div>

          <div>
            <div class="macro-label">${deficit >= 0 ? 'Дефицит' : 'Профицит'}</div>

          </div>

    <div class="card">
      <div class="card-head">
        <div class="card-title">Приёмы пищи</div>
        <button class="btn btn-sm" onclick="openAddMeal('${selected}')">+ Добавить</button>
      </div>
      ${meals.length === 0 ? `<div class="empty">Пока ничего не записано<br>Жми "+ Добавить"</div>` : meals.map((m) => {
        const totals = getMealTotal(m);
        return `
        <div class="meal">
          <div class="meal-head">
            <div>
              <div class="meal-name">${escapeHtml(m.name || 'Приём пищи')}</div>
              <div class="meal-time-kcal">${escapeHtml(m.time || '')}</div>
            </div>
            <div class="meal-time-kcal" style="text-align:right">
              <strong style="color:var(--text); font-size:14px">${Math.round(totals.kcal)} ккал</strong>
            </div>
          </div>
          <div class="meal-items">
            ${(m.items || []).map(item => `
              <div class="meal-item">
                <span class="meal-item-name">${escapeHtml(item.foodName || '—')}</span>
                <span class="meal-item-qty">${item.qty} ${item.unit || ''}</span>
                <span class="meal-item-kcal">${Math.round(item.kcal)} ккал</span>

          <div class="meal-macros">
            <span><strong>Б</strong> ${Math.round(totals.p)} г</span>
            <span><strong>Ж</strong> ${Math.round(totals.f)} г</span>
            <span><strong>У</strong> ${Math.round(totals.c)} г</span>
            <div class="meal-actions">
              <button class="meal-action-btn danger" onclick="deleteMeal('${selected}', '${m.id}')">Удалить</button>

          </div>

    ${(() => {
      const water = log.water || 0;
      const waterPct = Math.min(100, Math.round((water / t.targetWater) * 100));
      return `
      <div class="card">
        <div class="card-head">
          <div class="card-title">💧 Вода</div>
          <div class="card-meta">${water} / ${t.targetWater} мл</div>
        </div>
        <div class="act-bar" style="margin-bottom:12px"><div class="act-bar-fill" style="width:${waterPct}%; background:var(--blue)"></div></div>
        <div class="act-controls">
          <button class="act-btn" onclick="addWater('${selected}', 250)">+ 250 мл</button>
          <button class="act-btn" onclick="addWater('${selected}', 500)">+ 500 мл</button>
          <button class="act-btn" onclick="addWater('${selected}', 1000)">+ 1 л</button>
          <button class="act-btn danger" onclick="resetWater('${selected}')">↺ сброс</button>
        </div>
      </div>
      `;
    })()}

    <div class="card">
      <div class="card-head">
        <div class="card-title">Цели КБЖУ</div>
        <div class="card-meta">в день</div>
      </div>
      <div class="tip"><span class="tip-label">Стратегия</span>Рекомпозиция: лёгкий дефицит (~300 ккал ниже поддержки) + 2.1 г белка на кг. На таком режиме за месяц теряется жир и одновременно растут мышцы (особенно у новичков по нагрузке).</div>
      <div class="field-grid-2">
        <div class="field">
          <label class="field-label">Калории</label>
          <input type="number" inputmode="numeric" class="input" value="${t.targetKcal}"
            onchange="updateConfig('targetKcal', this.value)">
        </div>
        <div class="field">
          <label class="field-label">Белки, г</label>
          <input type="number" inputmode="numeric" class="input" value="${t.targetProtein}"
            onchange="updateConfig('targetProtein', this.value)">
        </div>
        <div class="field">
          <label class="field-label">Жиры, г</label>
          <input type="number" inputmode="numeric" class="input" value="${t.targetFat}"
            onchange="updateConfig('targetFat', this.value)">
        </div>
        <div class="field">
          <label class="field-label">Углеводы, г</label>
          <input type="number" inputmode="numeric" class="input" value="${t.targetCarbs}"
            onchange="updateConfig('targetCarbs', this.value)">

      <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--separator)">
        <div class="field">

          <input type="date" class="input" value="${t.startDate}"
            onchange="updateStartDate(this.value)">

          </div>
        </div>
      </div>
    </div>
  `;
}

function renderHabits() {
  return `
    <div class="seg">
      <button class="seg-btn ${state.ui.habitTab === 'smoking' ? 'active' : ''}" onclick="switchHabitTab('smoking')">Курение</button>
      <button class="seg-btn ${state.ui.habitTab === 'alcohol' ? 'active' : ''}" onclick="switchHabitTab('alcohol')">Алкоголь</button>
    </div>
    ${state.ui.habitTab === 'smoking' ? renderSmoking() : renderAlcohol()}
  `;
}

function renderSmoking() {
  const today = todayStr();
  const events = state.habits.smoking || [];

  let daysWithout = 0;
  const sortedDates = events.map(e => e.date).sort();
  const lastSmoked = sortedDates.length > 0 ? sortedDates[sortedDates.length - 1] : null;
  if (lastSmoked) {
    daysWithout = Math.max(0, daysBetween(lastSmoked, today));
  } else {
    daysWithout = daysBetween(state.config.startDate, today);
  }

  const thirtyAgo = new Date();
  thirtyAgo.setDate(thirtyAgo.getDate() - 30);
  const thirtyAgoStr = dateStr(thirtyAgo);
  const recentEvents = events.filter(e => e.date >= thirtyAgoStr);
  const totalCigs = recentEvents.reduce((a, e) => a + (e.count || 0), 0);
  const cleanDays = 30 - new Set(recentEvents.map(e => e.date)).size;

  const todayCount = events.filter(e => e.date === today).reduce((a, e) => a + (e.count || 0), 0);
  const recent = events.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 20);

  return `
    <div class="card">
      <div class="habit-big">
        <div class="habit-big-num">${daysWithout}</div>
        <div class="habit-big-label">${daysWithout === 1 ? 'день' : daysWithout >= 2 && daysWithout <= 4 ? 'дня' : 'дней'} без курения</div>
      </div>

      <div class="habit-stats">
        <div class="habit-stat">
          <div class="habit-stat-num">${totalCigs}</div>
          <div class="habit-stat-label">сигарет за 30 дней</div>
        </div>
        <div class="habit-stat">
          <div class="habit-stat-num">${cleanDays}</div>
          <div class="habit-stat-label">чистых дней из 30</div>
        </div>
      </div>

      <button class="btn btn-full" onclick="logSmoking()">
        ${todayCount > 0 ? `Сегодня уже: ${todayCount} · добавить ещё` : 'Курил — записать (+1)'}
      </button>
      ${todayCount > 0 ? `<button class="btn btn-secondary btn-full" style="margin-top:8px" onclick="undoSmoking()">Отменить последнюю (-1)</button>` : ''}
    </div>

    ${renderMilestones(daysWithout, SMOKING_MILESTONES)}

    <div class="card">
      <div class="card-head">
        <div class="card-title">История</div>
        <div class="card-meta">последние записи</div>
      </div>
      <div class="habit-list">
        ${recent.length === 0 ? `<div class="empty">Пока нет записей.<br>Хороший знак.</div>` : recent.map((e) => `
          <div class="habit-entry">
            <span class="habit-entry-date">${formatShortDate(e.date)}</span>
            <span class="habit-entry-detail">${e.date === today ? 'сегодня' : ''}</span>
            <span class="habit-entry-amount">${e.count} шт</span>
            <button class="meal-action-btn danger" style="margin-left:10px" onclick="deleteSmoking(${events.indexOf(e)})">×</button>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderAlcohol() {
  const today = todayStr();
  const events = state.habits.alcohol || [];
  const thirtyAgo = new Date();
  thirtyAgo.setDate(thirtyAgo.getDate() - 30);
  const thirtyAgoStr = dateStr(thirtyAgo);
  const recentEvents = events.filter(e => e.date >= thirtyAgoStr);
  const drinkingDays = new Set(recentEvents.map(e => e.date)).size;
  const totalDrinks = recentEvents.reduce((a, e) => a + (parseFloat(e.amount) || 0), 0);

  const lastDate = events.length > 0 ? events.map(e => e.date).sort().reverse()[0] : null;
  const daysSince = lastDate ? daysBetween(lastDate, today) : null;
  const recent = events.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 30);

  return `
    <div class="card">
      <div class="habit-big">
        <div class="habit-big-num">${daysSince === null ? '∞' : daysSince}</div>
        <div class="habit-big-label">${daysSince === null ? 'пока нет записей' : daysSince === 1 ? 'день без алкоголя' : daysSince >= 2 && daysSince <= 4 ? 'дня без алкоголя' : 'дней без алкоголя'}</div>
      </div>

      <div class="habit-stats">
        <div class="habit-stat">
          <div class="habit-stat-num">${drinkingDays}</div>
          <div class="habit-stat-label">дней с алкоголем (30 дн)</div>
        </div>
        <div class="habit-stat">
          <div class="habit-stat-num">${totalDrinks % 1 === 0 ? totalDrinks : totalDrinks.toFixed(1)}</div>
          <div class="habit-stat-label">порций за 30 дней</div>
        </div>
      </div>

      <button class="btn btn-full" onclick="addAlcohol()">+ Добавить запись</button>
    </div>

    ${renderMilestones(daysSince === null ? daysBetween(state.config.startDate, today) : daysSince, ALCOHOL_MILESTONES)}

    <div class="card">
      <div class="card-head">
        <div class="card-title">Журнал</div>
        <div class="card-meta">последние записи</div>
      </div>
      <div class="habit-list">
        ${recent.length === 0 ? `<div class="empty">Пока нет записей</div>` : recent.map((e) => `
          <div class="habit-entry">
            <span class="habit-entry-date">${formatShortDate(e.date)}</span>
            <span class="habit-entry-detail">${escapeHtml(e.drink || '—')}</span>
            <span class="habit-entry-amount">${escapeHtml(String(e.amount || ''))}</span>
            <button class="meal-action-btn danger" style="margin-left:10px" onclick="deleteAlcohol(${events.indexOf(e)})">×</button>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// ===== MODAL =====
function renderModal() {
  const root = document.getElementById('modal-root');
  if (!state.ui.modal) {
    root.innerHTML = '';
    return;
  }

  if (state.ui.modal.type === 'addMeal') {
    root.innerHTML = renderAddMealModal(state.ui.modal.data);
  }
}

function renderAddMealModal(data) {
  const tab = data.tab || 'templates';
  return `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-head">
          <div class="modal-title">Добавить приём пищи</div>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="food-search-tabs">
            <button class="seg-btn ${tab === 'templates' ? 'active' : ''}" onclick="setModalTab('templates')">Шаблоны</button>
            <button class="seg-btn ${tab === 'database' ? 'active' : ''}" onclick="setModalTab('database')">Из базы</button>
            <button class="seg-btn ${tab === 'quick' ? 'active' : ''}" onclick="setModalTab('quick')">Быстро</button>
          </div>
          ${tab === 'templates' ? renderTemplatesTab(data) : ''}
          ${tab === 'database' ? renderDatabaseTab(data) : ''}
          ${tab === 'quick' ? renderQuickTab(data) : ''}
        </div>
      </div>
    </div>
  `;
}

function renderTemplatesTab(data) {
  return `
    <div class="tpl-grid">
      ${TEMPLATES.map((t, i) => {
        // Calculate template total
        const items = t.items.map(it => {
          const f = FOODS.find(ff => ff.name === it.foodName);
          return f ? calcItem(f, it.qty) : null;
        }).filter(Boolean);
        const totalKcal = items.reduce((a, x) => a + x.kcal, 0);
        const totalP = items.reduce((a, x) => a + x.p, 0);
        return `
          <button class="tpl-btn" onclick="applyTemplate(${i})">
            <span class="tpl-emoji">${t.emoji}</span>
            <div class="tpl-name">${escapeHtml(t.name)}</div>
            <div class="tpl-kcal">${Math.round(totalKcal)} ккал · ${Math.round(totalP)} г белка</div>
          </button>
        `;
      }).join('')}
    </div>
  `;
}

function renderDatabaseTab(data) {
  // If a food is selected, show qty selector
  if (data.selectedFood) {
    const f = data.selectedFood;
    const qty = data.qty || (f.unit === 'г' || f.unit === 'мл' ? 100 : 1);
    const item = calcItem(f, qty);
    return `
      <div class="preview-box">
        <div class="preview-name">${escapeHtml(f.name)}${f.custom ? ' <span style="font-size:11px; color:var(--purple)">· свой</span>' : ''}</div>
        <div class="qty-input-row">
          <input type="number" inputmode="decimal" step="0.1" class="input" value="${qty}" id="modalQtyInput" oninput="updateModalQty(this.value)">
          <div class="qty-unit">${escapeHtml(f.unit)}</div>
        </div>
        <div class="preview-kcal">${item.kcal} ккал</div>
        <div class="preview-macros">
          <span>Б ${item.p} г</span>
          <span>Ж ${item.f} г</span>
          <span>У ${item.c} г</span>
        </div>
      </div>
      <button class="btn btn-full" onclick="addFoodToDraft()">Добавить</button>
      <button class="btn btn-secondary btn-full" style="margin-top:8px" onclick="backToDatabase()">← Назад к списку</button>
      ${renderDraft(data)}
    `;
  }

  // Создание своего продукта
  if (data.creatingFood) {
    const cf = data.newFood || { name: '', kcal: '', p: '', f: '', c: '', per: 100, unit: 'г' };
    return `
      <div class="preview-box">
        <div class="preview-name" style="margin-bottom:12px">Новый продукт</div>
        <div class="field">
          <label class="field-label">Название</label>
          <input type="text" class="input" placeholder="Например: Сыр Чеддер"
            value="${escapeHtml(cf.name)}" oninput="updateNewFood('name', this.value)">
        </div>
        <div class="field-grid-2">
          <div class="field">
            <label class="field-label">Единица</label>
            <select class="input" onchange="updateNewFood('unit', this.value)">
              <option value="г" ${cf.unit==='г'?'selected':''}>г (100 г)</option>
              <option value="мл" ${cf.unit==='мл'?'selected':''}>мл (100 мл)</option>
              <option value="шт" ${cf.unit==='шт'?'selected':''}>штука</option>
              <option value="порция" ${cf.unit==='порция'?'selected':''}>порция</option>
              <option value="ст.л." ${cf.unit==='ст.л.'?'selected':''}>ст. ложка</option>
              <option value="ч.л." ${cf.unit==='ч.л.'?'selected':''}>ч. ложка</option>
            </select>
          </div>
          <div class="field">
            <label class="field-label">КБЖУ за</label>
            <input type="number" inputmode="numeric" class="input"
              value="${cf.per}" onchange="updateNewFood('per', this.value)">
          </div>
        </div>
        <div class="field-grid-2">
          <div class="field">
            <label class="field-label">Калории</label>
            <input type="number" inputmode="numeric" class="input" placeholder="ккал"
              value="${cf.kcal}" oninput="updateNewFood('kcal', this.value)">
          </div>
          <div class="field">
            <label class="field-label">Белки, г</label>
            <input type="number" inputmode="decimal" step="0.1" class="input" placeholder="г"
              value="${cf.p}" oninput="updateNewFood('p', this.value)">
          </div>
          <div class="field">
            <label class="field-label">Жиры, г</label>
            <input type="number" inputmode="decimal" step="0.1" class="input" placeholder="г"
              value="${cf.f}" oninput="updateNewFood('f', this.value)">
          </div>
          <div class="field">
            <label class="field-label">Углеводы, г</label>
            <input type="number" inputmode="decimal" step="0.1" class="input" placeholder="г"
              value="${cf.c}" oninput="updateNewFood('c', this.value)">
          </div>
        </div>
      </div>
      <button class="btn btn-full" onclick="saveNewFood()">Сохранить продукт</button>
      <button class="btn btn-secondary btn-full" style="margin-top:8px" onclick="cancelNewFood()">← Отмена</button>
    `;
  }

  // Search
  const search = (data.search || '').toLowerCase().trim();
  const allFoods = getAllFoods();
  let filtered = allFoods;
  if (search) {
    filtered = allFoods.filter(f => {
      if (f.name.toLowerCase().includes(search)) return true;
      for (const m of (f.match || [])) {
        if (m.includes(search) || search.includes(m)) return true;
      }
      return false;
    });
  }

  // Group by category
  const byCat = {};
  for (const f of filtered) {
    if (!byCat[f.cat]) byCat[f.cat] = [];
    byCat[f.cat].push(f);
  }

  // Кастомная категория для customFoods
  const customCat = { id: 'custom', name: 'Мои продукты', emoji: '⭐' };
  const cats = [customCat, ...FOOD_CATEGORIES];

  return `
    ${renderDraft(data)}
    <div class="search-row">
      <input type="text" class="input search-input" placeholder="🔍 Поиск продукта..."
        value="${escapeHtml(data.search || '')}" oninput="updateSearch(this.value)">
      <button class="btn btn-sm" onclick="startCreateFood()">+ Свой</button>
    </div>
    ${filtered.length === 0 ? `<div class="empty">Ничего не найдено<br><button class="btn btn-sm" style="margin-top:10px" onclick="startCreateFood()">Создать «${escapeHtml(search)}»</button></div>` : ''}
    ${cats.filter(c => byCat[c.id]).map(c => `
      <div class="food-cat">${c.emoji} ${escapeHtml(c.name)}</div>
      ${byCat[c.id].map(f => `
        <div class="food-item" onclick="selectFoodByObj(${escapeHtml(JSON.stringify(f.name))})">
          <div class="food-item-info">
            <div class="food-item-name">${escapeHtml(f.name)}${f.custom ? ' <span style="color:var(--purple); font-size:11px">★</span>' : ''}</div>
            <div class="food-item-meta">${f.kcal} ккал · ${f.p}Б ${f.f}Ж ${f.c}У · за ${f.per} ${f.unit}</div>
          </div>
          <button class="food-item-add">+</button>
        </div>
      `).join('')}
    `).join('')}
  `;
}

function renderDraft(data) {
  const draft = data.draft || [];
  if (draft.length === 0) return '';
  const totals = draft.reduce((a, x) => ({
    kcal: a.kcal + x.kcal, p: a.p + x.p, f: a.f + x.f, c: a.c + x.c
  }), { kcal: 0, p: 0, f: 0, c: 0 });
  return `
    <div class="preview-box" style="margin-bottom:16px">
      <div class="preview-name">Черновик приёма пищи</div>
      <div style="margin: 10px 0 8px">
        ${draft.map((it, i) => `
          <div class="meal-item">
            <span class="meal-item-name">${escapeHtml(it.foodName)}</span>
            <span class="meal-item-qty">${it.qty} ${it.unit}</span>
            <span class="meal-item-kcal">${Math.round(it.kcal)} ккал</span>
            <button class="meal-action-btn danger" onclick="removeDraftItem(${i})">×</button>
          </div>
        `).join('')}
      </div>
      <div class="preview-kcal">${Math.round(totals.kcal)} ккал</div>
      <div class="preview-macros">
        <span>Б ${Math.round(totals.p)} г</span>
        <span>Ж ${Math.round(totals.f)} г</span>
        <span>У ${Math.round(totals.c)} г</span>
      </div>
    </div>
    <div class="field-grid-2">
      <div class="field">
        <label class="field-label">Название</label>
        <input type="text" class="input" placeholder="Завтрак, Обед..." value="${escapeHtml(data.mealName || '')}" oninput="updateDraftMeta('mealName', this.value)">
      </div>
      <div class="field">
        <label class="field-label">Время</label>
        <input type="time" class="input" value="${escapeHtml(data.mealTime || '')}" oninput="updateDraftMeta('mealTime', this.value)">
      </div>
    </div>
    <button class="btn btn-full" onclick="saveDraftMeal()">Сохранить приём пищи</button>
    <div style="height:16px"></div>
  `;
}

function renderQuickTab(data) {
  const q = data.quick || { name: '', kcal: '', p: '', f: '', c: '' };
  const time = data.mealTime || (() => {
    const n = new Date();
    return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  })();
  return `
    <div class="tip" style="margin-bottom:14px">
      <span class="tip-label">Идея</span>
      Спроси у ChatGPT КБЖУ блюда (по фото или описанию) — он выдаст цифры. Забей их сюда: одно блюдо = одна запись. Удобно для ресторанной еды.
    </div>
    <div class="field">
      <label class="field-label">Что съел</label>
      <input type="text" class="input" id="quickName" placeholder="Шницель с картофелем · Суп с лапшой · ..."
        value="${escapeHtml(q.name)}" oninput="updateQuickField('name', this.value)">
    </div>
    <div class="field-grid-2">
      <div class="field">
        <label class="field-label">Калории, ккал</label>
        <input type="number" inputmode="numeric" class="input" id="quickKcal" placeholder="0"
          value="${q.kcal}" oninput="updateQuickField('kcal', this.value)">
      </div>
      <div class="field">
        <label class="field-label">Время</label>
        <input type="time" class="input" value="${escapeHtml(time)}"
          oninput="updateDraftMeta('mealTime', this.value)">
      </div>
    </div>
    <div class="field-grid-2">
      <div class="field">
        <label class="field-label">Белки, г</label>
        <input type="number" inputmode="decimal" step="0.1" class="input" placeholder="0"
          value="${q.p}" oninput="updateQuickField('p', this.value)">
      </div>
      <div class="field">
        <label class="field-label">Жиры, г</label>
        <input type="number" inputmode="decimal" step="0.1" class="input" placeholder="0"
          value="${q.f}" oninput="updateQuickField('f', this.value)">
      </div>
    </div>
    <div class="field">
      <label class="field-label">Углеводы, г</label>
      <input type="number" inputmode="decimal" step="0.1" class="input" placeholder="0"
        value="${q.c}" oninput="updateQuickField('c', this.value)">
    </div>
    <div class="preview-box" id="quickPreview" style="margin-top:14px">
      <div class="preview-name">${escapeHtml(q.name || 'Запись')}</div>
      <div class="preview-kcal">${q.kcal || 0} ккал</div>
      <div class="preview-macros">
        <span>Б ${q.p || 0} г</span>
        <span>Ж ${q.f || 0} г</span>
        <span>У ${q.c || 0} г</span>
      </div>
    </div>
    <button class="btn btn-full" style="margin-top:14px" onclick="saveQuickMeal()">Сохранить</button>
  `;
}

// ===== ACTIONS =====
window.switchTab = function(tab) { state.ui.tab = tab; render(); };
window.switchHabitTab = function(tab) { state.ui.habitTab = tab; render(); };
window.selectDate = function(date) { state.ui.selectedDate = date; render(); };

window.toggleExercise = function(date, id) {
  const log = getLog(date);
  log.exercises[id] = !log.exercises[id];
  saveState(); render();
};

window.updateField = function(date, field, value, type) {
  const log = getLog(date);
  if (type === 'float') log[field] = value === '' ? null : parseFloat(value);
  else if (type === 'int') log[field] = value === '' ? null : parseInt(value);
  else log[field] = value;
  saveState();
  // Точечный апдейт верхних статов без полного render — иначе ввод слетает
  if (field === 'weight') {
    const el = document.getElementById('stat-weight-val');
    const delta = document.getElementById('stat-weight-delta');
    const cw = getLastWeight();
    const wd = cw - state.config.startWeight;
    if (el) el.textContent = cw;
    if (delta) {
      delta.textContent = wd === 0 ? '—' : (wd > 0 ? '+' : '') + wd.toFixed(1) + ' кг';
      delta.className = 'stat-delta ' + (wd < 0 ? 'pos' : wd > 0 ? 'neg' : '');
    }
  }
  if (field === 'pullups') {
    const el = document.getElementById('stat-pullups-val');
    if (el) el.textContent = getMaxPullups();
  }
};

window.updateConfig = function(key, value) {
  state.config[key] = parseFloat(value) || 0;
  saveState(); render();
};

window.updateStartDate = function(value) {
  if (!value) return;
  state.config.startDate = value;
  saveState();
  render();
};

window.addWater = function(date, ml) {
  const log = getLog(date);
  log.water = (log.water || 0) + ml;
  saveState(); render();
};

window.resetWater = function(date) {
  const log = getLog(date);
  log.water = 0;
  saveState(); render();
};

window.addSteps = function(date, n) {
  const log = getLog(date);
  log.steps = (log.steps || 0) + n;
  saveState(); render();
};

window.addSwim = function(date, m) {
  const log = getLog(date);
  log.swim = (log.swim || 0) + m;
  saveState(); render();
};

window.setSteps = function(date, value) {
  const log = getLog(date);
  log.steps = value === '' ? null : parseInt(value);
  saveState(); render();
};

window.setSwim = function(date, value) {
  const log = getLog(date);
  log.swim = value === '' ? null : parseInt(value);
  saveState(); render();
};

window.resetSteps = function(date) {
  const log = getLog(date);
  log.steps = null;
  saveState(); render();
};

window.resetSwim = function(date) {
  const log = getLog(date);
  log.swim = null;
  saveState(); render();
};

// ===== MODAL CONTROL =====
window.openAddMeal = function(date) {
  const now = new Date();
  const time = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  state.ui.modal = {
    type: 'addMeal',
    data: {
      date: date,
      tab: 'templates',
      draft: [],
      mealName: '',
      mealTime: time,
      selectedFood: null,
      text: '',
      parsed: []
    }
  };
  renderModal();
};

window.closeModal = function() {
  state.ui.modal = null;
  renderModal();
};

window.setModalTab = function(tab) {
  state.ui.modal.data.tab = tab;
  state.ui.modal.data.selectedFood = null;
  renderModal();
};

window.applyTemplate = function(idx) {
  const t = TEMPLATES[idx];
  const items = t.items.map(it => {
    const f = FOODS.find(ff => ff.name === it.foodName);
    return f ? calcItem(f, it.qty) : null;
  }).filter(Boolean);

  const date = state.ui.modal.data.date;
  const log = getLog(date);
  log.meals.push({
    id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    name: t.name,
    time: t.time,
    items: items
  });
  saveState();
  closeModal();
  render();
};

window.selectFoodFromDb = function(idx) {
  const f = FOODS[idx];
  state.ui.modal.data.selectedFood = f;
  state.ui.modal.data.qty = (f.unit === 'г' || f.unit === 'мл') ? 100 : 1;
  renderModal();
};

window.selectFoodByObj = function(name) {
  const all = getAllFoods();
  const f = all.find(x => x.name === name);
  if (!f) return;
  state.ui.modal.data.selectedFood = f;
  state.ui.modal.data.qty = (f.unit === 'г' || f.unit === 'мл') ? 100 : 1;
  renderModal();
};

window.updateSearch = function(val) {
  state.ui.modal.data.search = val;
  // Inline update without full re-render to keep focus
  const root = document.getElementById('modal-root');
  if (root) {
    const focused = document.activeElement;
    const wasFocused = focused && focused.classList.contains('search-input');
    const cursorPos = wasFocused ? focused.selectionStart : null;
    renderModal();
    if (wasFocused) {
      const newInput = document.querySelector('.search-input');
      if (newInput) {
        newInput.focus();
        if (cursorPos !== null) newInput.setSelectionRange(cursorPos, cursorPos);
      }
    }
  }
};

window.startCreateFood = function() {
  state.ui.modal.data.creatingFood = true;
  const search = state.ui.modal.data.search || '';
  state.ui.modal.data.newFood = {
    name: search, kcal: '', p: '', f: '', c: '', per: 100, unit: 'г'
  };
  renderModal();
};

window.updateNewFood = function(field, value) {
  if (!state.ui.modal.data.newFood) return;
  state.ui.modal.data.newFood[field] = value;
};

window.cancelNewFood = function() {
  state.ui.modal.data.creatingFood = false;
  state.ui.modal.data.newFood = null;
  renderModal();
};

window.saveNewFood = function() {
  const cf = state.ui.modal.data.newFood;
  if (!cf || !cf.name || cf.kcal === '') {
    alert('Заполни хотя бы название и калории');
    return;
  }
  const food = {
    name: cf.name.trim(),
    kcal: parseFloat(cf.kcal) || 0,
    p: parseFloat(cf.p) || 0,
    f: parseFloat(cf.f) || 0,
    c: parseFloat(cf.c) || 0,
    per: parseFloat(cf.per) || 100,
    unit: cf.unit || 'г',
    cat: 'custom',
    match: [cf.name.toLowerCase().trim()]
  };
  if (!state.customFoods) state.customFoods = [];
  state.customFoods.push(food);
  saveState();
  state.ui.modal.data.creatingFood = false;
  state.ui.modal.data.newFood = null;
  state.ui.modal.data.selectedFood = food;
  state.ui.modal.data.qty = (food.unit === 'г' || food.unit === 'мл') ? 100 : 1;
  renderModal();
};

window.backToDatabase = function() {
  state.ui.modal.data.selectedFood = null;
  renderModal();
};

window.updateModalQty = function(val) {
  const qty = parseFloat(val) || 0;
  state.ui.modal.data.qty = qty;
  // Точечный апдейт preview без полной перерисовки модалки (иначе ввод слетает)
  const f = state.ui.modal.data.selectedFood;
  if (!f) return;
  const item = calcItem(f, qty);
  const previewBox = document.querySelector('.modal-body .preview-box');
  if (previewBox) {
    const kcalEl = previewBox.querySelector('.preview-kcal');
    const macrosEl = previewBox.querySelector('.preview-macros');
    if (kcalEl) kcalEl.textContent = item.kcal + ' ккал';
    if (macrosEl) macrosEl.innerHTML =
      `<span>Б ${item.p} г</span><span>Ж ${item.f} г</span><span>У ${item.c} г</span>`;
  }
};

window.addFoodToDraft = function() {
  const d = state.ui.modal.data;
  if (!d.selectedFood || !d.qty) return;
  const item = calcItem(d.selectedFood, d.qty);
  if (!d.draft) d.draft = [];
  d.draft.push(item);
  d.selectedFood = null;
  renderModal();
};

window.removeDraftItem = function(idx) {
  state.ui.modal.data.draft.splice(idx, 1);
  renderModal();
};

window.updateDraftMeta = function(field, value) {
  state.ui.modal.data[field] = value;
};

window.saveDraftMeal = function() {
  const d = state.ui.modal.data;
  if (!d.draft || d.draft.length === 0) {
    alert('Добавь хотя бы один продукт');
    return;
  }
  const log = getLog(d.date);
  log.meals.push({
    id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    name: d.mealName || 'Приём пищи',
    time: d.mealTime || '',
    items: d.draft
  });
  saveState();
  closeModal();
  render();
};

window.updateQuickField = function(field, value) {
  const d = state.ui.modal.data;
  if (!d.quick) d.quick = { name: '', kcal: '', p: '', f: '', c: '' };
  d.quick[field] = value;
  // Точечный апдейт превью без перерисовки всей формы
  const preview = document.getElementById('quickPreview');
  if (preview) {
    const q = d.quick;
    preview.innerHTML = `
      <div class="preview-name">${escapeHtml(q.name || 'Запись')}</div>
      <div class="preview-kcal">${q.kcal || 0} ккал</div>
      <div class="preview-macros">
        <span>Б ${q.p || 0} г</span>
        <span>Ж ${q.f || 0} г</span>
        <span>У ${q.c || 0} г</span>
      </div>
    `;
  }
};

window.saveQuickMeal = function() {
  const d = state.ui.modal.data;
  const q = d.quick || {};
  const kcal = parseFloat(q.kcal) || 0;
  if (kcal === 0 && !q.p && !q.f && !q.c) {
    alert('Введи хотя бы калории');
    return;
  }
  const log = getLog(d.date);
  log.meals.push({
    id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    name: q.name || 'Приём пищи',
    time: d.mealTime || '',
    items: [{
      foodName: q.name || 'Свободный ввод',
      qty: 1,
      unit: 'порция',
      kcal: kcal,
      p: parseFloat(q.p) || 0,
      f: parseFloat(q.f) || 0,
      c: parseFloat(q.c) || 0
    }]
  });
  saveState();
  closeModal();
  render();
};

window.deleteMeal = function(date, mealId) {
  const log = getLog(date);
  const idx = log.meals.findIndex(m => m.id === mealId);
  if (idx !== -1) log.meals.splice(idx, 1);
  saveState();
  render();
};

// ===== HABITS =====
window.logSmoking = function() {
  const today = todayStr();
  const existingToday = state.habits.smoking.find(e => e.date === today);
  if (existingToday) existingToday.count = (existingToday.count || 0) + 1;
  else state.habits.smoking.push({ date: today, count: 1 });
  saveState(); render();
};

window.undoSmoking = function() {
  const today = todayStr();
  const existingToday = state.habits.smoking.find(e => e.date === today);
  if (existingToday) {
    existingToday.count = (existingToday.count || 0) - 1;
    if (existingToday.count <= 0) {
      const idx = state.habits.smoking.indexOf(existingToday);
      state.habits.smoking.splice(idx, 1);
    }
  }
  saveState(); render();
};

window.deleteSmoking = function(idx) {
  state.habits.smoking.splice(idx, 1);
  saveState(); render();
};

window.addAlcohol = function() {
  const today = todayStr();
  const date = prompt('Дата (YYYY-MM-DD), пусто = сегодня:', today);
  const finalDate = date || today;
  const drink = prompt('Что пил? (Например: Пиво, Вино, Виски)');
  if (!drink) return;
  const amount = prompt('Сколько? (Например: 500 мл, 2 бокала)');
  if (amount === null) return;
  state.habits.alcohol.push({ date: finalDate, drink, amount });
  saveState(); render();
};

window.deleteAlcohol = function(idx) {
  state.habits.alcohol.splice(idx, 1);
  saveState(); render();
};

// ===== EXPORT =====
window.exportData = function() {
  const data = JSON.stringify({
    config: state.config, logs: state.logs, habits: state.habits,
    exportedAt: new Date().toISOString()
  }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `transformation_${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
};

window.importData = function() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        const importedStart = data.config && data.config.startDate;
        const currentStart = state.config.startDate;

        if (data.logs) state.logs = data.logs;
        if (data.config) state.config = { ...state.config, ...data.config };
        if (data.habits) state.habits = { smoking: [], alcohol: [], ...data.habits };
        if (data.customFoods) state.customFoods = data.customFoods;

        // Спрашиваем про дату старта, если она отличается
        if (importedStart && importedStart !== currentStart) {
          const today = todayStr();
          const useToday = confirm(
            `В импортированных данных дата старта программы: ${importedStart}\n\n` +
            `OK = начать заново с сегодня (${today}). История сохранится, но день 1 = сегодня.\n` +
            `Отмена = оставить дату ${importedStart} из импорта.`
          );
          if (useToday) {
            state.config.startDate = today;
          }
        }

        saveState(); render();
        alert('Данные импортированы.');
      } catch (err) {
        alert('Ошибка импорта: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
};

window.resetAll = function() {
  if (!confirm('Сбросить все данные? Это нельзя отменить.\nСовет: сначала сделай экспорт JSON.')) return;
  state.logs = {};
  state.habits = { smoking: [], alcohol: [] };
  state.ui.selectedDate = null;
  saveState(); render();
};

loadState();
render();
</script>
